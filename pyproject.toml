[project]
name = "nvautonet"
version = "0.1.0"
description = "NVAutoNet: Fast and Accurate 360° 3D Visual Perception - nuScenes Reproduction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "NVAutoNet Reproduction Team"}
]

dependencies = [
    # PyTorch installed via conda separately
    "numpy>=1.19.0",
    "scipy>=1.7.0",
    "nuscenes-devkit>=1.1.9",
    "pyquaternion>=0.9.9",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "opencv-python>=4.5.0",
    "pillow>=8.3.0",
    "tensorboard>=2.8.0",
    "tqdm>=4.62.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nvautonet*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
